<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background:#121212; color:white; font-family:'Poppins', sans-serif;">
<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center;">
    <h1 style="font-size:36px; margin-bottom:20px;">Search Films By People</h1>

    <form action="/people" method="GET" style="display:flex; flex-direction:column; gap:10px; align-items:center;">
        <input type="text" name="name1" placeholder="Person name #1" style="padding:10px; width:300px; background:#1e1e1e; color:white; border-radius:6px; border:1px solid #444;" />
        <input type="text" name="name2" placeholder="Person name #2 (optional)" style="padding:10px; width:300px; background:#1e1e1e; color:white; border-radius:6px; border:1px solid #444;" />
        <input type="text" name="name3" placeholder="Person name #3 (optional)" style="padding:10px; width:300px; background:#1e1e1e; color:white; border-radius:6px; border:1px solid #444;" />
        <button type="submit" style="padding:10px 20px; background:#43A047; color:white; border-radius:6px; border:none; font-size:16px;">Search Films</button>
    </form>

    <a href="/" style="color:#4DA3FF; margin-top:16px;">Home</a>
</div>
</body>
</html>
