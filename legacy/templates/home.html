<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="
    margin:0;
    padding:0;
    font-family:'Poppins', sans-serif;
    background:#121212;     /* DARK BACKGROUND */
    color:#ffffff;          /* WHITE TEXT */
">

<!-- Center everything on the screen -->
<div style="
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
">

    <h1 style="font-size:48px; margin-bottom:40px; color:#FFFFFF;">
        Kovarboxd
    </h1>

    <!-- Buttons with equal width -->
    <a href="/movie" style="
        padding:12px 24px;
        margin:10px;
        background:#1E88E5;      /* Bright Blue */
        color:white;
        text-decoration:none;
        border-radius:6px;
        font-size:20px;
        width:250px;
        display:inline-block;
    ">Search for a Movie</a>

    <a href="/person" style="
        padding:12px 24px;
        margin:10px;
        background:#43A047;      /* Bright Green */
        color:white;
        text-decoration:none;
        border-radius:6px;
        font-size:20px;
        width:250px;
        display:inline-block;
    ">Search for a Person</a>

    <a href="/people" style="
        padding:12px 24px;
        margin:10px;
        background:#d49800;      /* Purple */
        color:white;
        text-decoration:none;
        border-radius:6px;
        font-size:20px;
        width:250px;
        display:inline-block;
    ">Search Films by People</a>

</div>

</body>
</html>
